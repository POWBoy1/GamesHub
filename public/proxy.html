<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Classroom</title>
  <link rel="icon" id="siteFavicon" href="assets/GoogleClassroomIcon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg, #1a0b0b);
      color: var(--text, #f0e5e5);
      font-family: 'Inter', system-ui, sans-serif;
    }

    #loadingbar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0;
      background: var(--accent, #ff5c5c);
      z-index: 9999;
      opacity: 0;
      transition: width 0.3s ease, opacity 0.3s ease;
      border-radius: 0 2px 2px 0;
    }

    #gooei {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s, visibility 0.15s;
    }
    #gooei.visible {
      opacity: 1;
      visibility: visible;
    }
    #uv-form {
      width: 100%;
      max-width: 560px;
      padding: 0 16px;
    }
    #teacher-setup-dialogs-container-searchbar {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid var(--border, #4a1e1e);
      background: var(--panel, #2e1616);
      color: var(--text, #f0e5e5);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #teacher-setup-dialogs-container-searchbar:focus {
      border-color: var(--accent, #ff5c5c);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 2px var(--accent-glow, rgba(255,92,92,0.4));
    }

    #iframeid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: calc(100% - 52px);
      border: none;
      background: #fff;
    }

    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: var(--panel, #2e1616);
      border-top: 1px solid var(--border, #4a1e1e);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 200;
    }

    #teacher-setup-dialogs-container {
      flex: 1;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border, #4a1e1e);
      background: var(--bg, #1a0b0b);
      color: var(--text, #f0e5e5);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      caret-color: transparent;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .headericons {
      width: 28px;
      height: 28px;
      padding: 4px;
      border-radius: 7px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s, background 0.15s;
      filter: invert(1) brightness(10);
    }
    .headericons:hover {
      opacity: 1;
      background: var(--border, #4a1e1e);
    }

    #historyModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    #historyModal.open { display: flex; }

    #historyContent {
      background: var(--panel, #2e1616);
      border: 1px solid var(--border, #4a1e1e);
      border-radius: 12px;
      width: 480px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }

    #historyHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border, #4a1e1e);
    }
    #historyHeader h2 { font-size: 15px; font-weight: 600; }
    #historyActions { display: flex; gap: 8px; }
    #historyActions button {
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
    }
    #clearHistoryBtn { background: #3a1a1a; color: #f87171; }
    #closeHistoryBtn { background: var(--bg, #1a0b0b); color: var(--text, #f0e5e5); }

    #historyList { overflow-y: auto; flex: 1; padding: 8px 0; }
    .history-item {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text, #f0e5e5);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s;
    }
    .history-item:hover { background: var(--bg, #1a0b0b); }
    .history-empty {
      padding: 24px 20px;
      text-align: center;
      color: var(--muted, #c4a0a0);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="loadingbar"></div>

  <div id="historyModal" onclick="if(event.target===this) hideHistory()">
    <div id="historyContent">
      <div id="historyHeader">
        <h2>Browsing History</h2>
        <div id="historyActions">
          <button id="clearHistoryBtn" onclick="clearHistory()">Clear All</button>
          <button id="closeHistoryBtn" onclick="hideHistory()">Close</button>
        </div>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <div id="gooei">
    <form id="uv-form">
      <input id="teacher-setup-dialogs-container-searchbar" type="text" placeholder="Search or enter URL..." autocomplete="off">
    </form>
  </div>

  <iframe src="" id="iframeid" allowfullscreen
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts">
  </iframe>

  <div id="footer">
    <img class="headericons" src="assets/home.svg" onclick="window.location.href='index.html'" alt="Home" title="Home">
    <input id="teacher-setup-dialogs-container" type="text" placeholder="Search or enter URL..." autocomplete="off" readonly>
    <div class="right">
      <img class="headericons" src="assets/back.svg"    onclick="goback()"      alt="Back"    title="Back">
      <img class="headericons" src="assets/forward.svg" onclick="goforward()"   alt="Forward" title="Forward">
      <img class="headericons" src="assets/refresh.svg" onclick="fn_reload()"   alt="Refresh" title="Refresh">
      <img class="headericons" src="assets/history.svg" onclick="showHistory()" alt="History" title="History">
    </div>
  </div>

  <script src="/baremux/index.js"></script>
  <script>
    const iframe            = document.getElementById('iframeid');
    const searchInputFooter = document.getElementById('teacher-setup-dialogs-container');
    const searchBox         = document.getElementById('gooei');
    const searchInputBox    = document.getElementById('teacher-setup-dialogs-container-searchbar');
    const form              = document.getElementById('uv-form');
    const loadingBar        = document.getElementById('loadingbar');

    const savedTitle = localStorage.getItem('tabTitle');
    const savedIcon  = localStorage.getItem('tabIcon');
    if (savedTitle) document.title = savedTitle;
    if (savedIcon)  document.getElementById('siteFavicon').href = savedIcon;

    let lastURL = '';

    function resolveURL(val) {
      const trimmed = val.trim();
      if (!trimmed) return null;
      const looksLikeURL =
        trimmed.startsWith('http://') || trimmed.startsWith('https://') ||
        (/^[^\s]+\.[a-zA-Z]{2,}(\/.*)?$/.test(trimmed) && !trimmed.includes(' '));
      if (looksLikeURL) {
        return (trimmed.startsWith('http://') || trimmed.startsWith('https://'))
          ? trimmed : 'https://' + trimmed;
      }
      return `https://duckduckgo.com/?q=${encodeURIComponent(trimmed)}`;
    }

    async function loadNewPage(input) {
      const url = resolveURL(input);
      if (!url) return;
      searchInputBox.blur();

      try {
        const connection = new BareMux.BareMuxConnection('/baremux/worker.js');
        await connection.setTransport('/epoxy/index.mjs', [{
          wisp: 'wss://' + location.host + '/wisp/',
          disable_certificate_validation: true
        }]);
      } catch(e) { console.warn('transport:', e); }

      iframe.src = '/scramjet/' + encodeURIComponent(url);
      updateSearchBars(url);
      showLoadingBar();
      addToHistory(url);
    }

    function updateSearchBars(url) {
      searchInputFooter.value = url;
      searchInputBox.value    = url;
    }

    function showLoadingBar() {
      loadingBar.style.width   = '10%';
      loadingBar.style.opacity = '1';
    }
    function hideLoadingBar() {
      loadingBar.style.width = '100%';
      setTimeout(() => { loadingBar.style.opacity = '0'; loadingBar.style.width = '0'; }, 300);
    }

    function fn_reload() { try { iframe.contentWindow.location.reload(); } catch(e) { iframe.src = iframe.src; } }
    function goback()    { try { iframe.contentWindow.history.back();    } catch(e) {} }
    function goforward() { try { iframe.contentWindow.history.forward(); } catch(e) {} }

    function checkIframeURL() {
      try {
        const currentURL = iframe.contentWindow.location.href;
        if (currentURL && currentURL !== lastURL) {
          lastURL = currentURL;
          const stripped = decodeURIComponent(currentURL.replace(location.origin + '/scramjet/', ''));
          if (stripped && stripped !== 'about:blank' && stripped.startsWith('http')) {
            updateSearchBars(stripped);
          }
        }
      } catch(_) {}
    }

    function showSearchBox() {
      searchInputBox.value = searchInputFooter.value;
      searchBox.classList.add('visible');
      setTimeout(() => searchInputBox.focus(), 50);
    }
    function hideSearchBox() { searchBox.classList.remove('visible'); }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const input = searchInputBox.value.trim();
      if (input) { loadNewPage(input); hideSearchBox(); }
    });

    searchInputFooter.addEventListener('click', () => showSearchBox());

    searchInputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); loadNewPage(searchInputBox.value.trim()); hideSearchBox(); }
      else if (e.key === 'Escape') { hideSearchBox(); }
    });

    document.addEventListener('click', e => {
      if (!searchBox.contains(e.target) && e.target !== searchInputFooter) hideSearchBox();
    });

    iframe.addEventListener('load', hideLoadingBar);
    setInterval(checkIframeURL, 150);

    function getHistory() { return JSON.parse(localStorage.getItem('proxyHistory') || '[]'); }
    function addToHistory(url) {
      if (!url || url === 'about:blank') return;
      let h = getHistory().filter(u => u !== url);
      h.unshift(url);
      if (h.length > 100) h = h.slice(0, 100);
      localStorage.setItem('proxyHistory', JSON.stringify(h));
    }
    function clearHistory() { localStorage.removeItem('proxyHistory'); renderHistory(); }
    function showHistory()  { renderHistory(); document.getElementById('historyModal').classList.add('open'); }
    function hideHistory()  { document.getElementById('historyModal').classList.remove('open'); }
    function renderHistory() {
      const list = document.getElementById('historyList');
      const h = getHistory();
      if (!h.length) { list.innerHTML = '<div class="history-empty">No history yet</div>'; return; }
      list.innerHTML = h.map(url =>
        `<div class="history-item" onclick="loadNewPage('${url.replace(/'/g,"\\'")}');hideHistory()">${url}</div>`
      ).join('');
    }

    const panicKey = localStorage.getItem('panicKey') || '=';
    const panicURL = localStorage.getItem('panicURL') || 'https://classroom.google.com';
    document.addEventListener('keydown', e => { if (e.key === panicKey) window.location.href = panicURL; });

    const params   = new URLSearchParams(location.search);
    const startURL = params.get('url');
    if (startURL) loadNewPage(startURL);
  </script>
</body>
</html>
